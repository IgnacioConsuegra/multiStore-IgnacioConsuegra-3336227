<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders - Academia Admin</title>

    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/admin-orders.css">
</head>

<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="admin-orders-wrapper py-5">

        <div class="container max-w-7xl">
            <div id="adminManagement"></div>
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="font-heading fw-bold text-dark-custom mb-0 fs-4">Orders management</h2>
                </button>
            </div>
            <!-- Stats Summary -->
            <div class="row g-4 mb-5 animate-fade-in">
                <div class="col-12 col-md-3">
                    <div class="bg-paper p-4 border custom-border-light rounded-1 shadow-sm h-100">
                        <p class="text-muted-custom small fw-medium text-uppercase tracking-wider mb-2">Total Orders</p>
                        <p class="font-heading fs-2 fw-bold text-dark-custom mb-0" id="stat-total-orders">0</p>
                    </div>
                </div>
                <div class="col-12 col-md-3">
                    <div class="bg-paper p-4 border custom-border-light rounded-1 shadow-sm h-100">
                        <p class="text-muted-custom small fw-medium text-uppercase tracking-wider mb-2">Pending</p>
                        <p class="font-heading fs-2 fw-bold text-dark-custom mb-0" id="stat-pending-orders">0</p>
                    </div>
                </div>
                <div class="col-12 col-md-3">
                    <div class="bg-paper p-4 border custom-border-light rounded-1 shadow-sm h-100">
                        <p class="text-muted-custom small fw-medium text-uppercase tracking-wider mb-2">Processing</p>
                        <p class="font-heading fs-2 fw-bold text-dark-custom mb-0" id="stat-processing-orders">0</p>
                    </div>
                </div>
                <div class="col-12 col-md-3">
                    <div class="bg-paper p-4 border custom-border-light rounded-1 shadow-sm h-100">
                        <p class="text-muted-custom small fw-medium text-uppercase tracking-wider mb-2">Completed
                            Revenue</p>
                        <p class="font-heading fs-2 fw-bold text-success mb-0" id="stat-revenue">$0.00</p>
                    </div>
                </div>
            </div>

            <!-- Orders Table Container -->
            <div class="bg-paper border custom-border-light rounded-1 shadow-sm overflow-hidden animate-fade-in">
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead class="bg-light-custom">
                            <tr>
                                <th class="text-dark-custom fw-semibold py-3 px-4 font-sans text-uppercase small">Order
                                    Details</th>
                                <th class="text-dark-custom fw-semibold py-3 px-4 font-sans text-uppercase small">
                                    Products</th>
                                <th class="text-dark-custom fw-semibold py-3 px-4 font-sans text-uppercase small">Price
                                </th>
                                <th class="text-dark-custom fw-semibold py-3 px-4 font-sans text-uppercase small">Status
                                </th>
                                <th
                                    class="text-dark-custom fw-semibold py-3 px-4 font-sans text-uppercase small text-end">
                                    Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody" class="border-top-0">
                        </tbody>
                    </table>
                </div>

                <!-- Empty State -->
                <div id="orders-empty" class="p-5 text-center d-none">
                    <i class="fa-solid fa-clipboard-list text-muted-custom opacity-25 display-4 mb-3"></i>
                    <p class="text-muted-custom font-sans mb-0">No orders found at the moment.</p>
                </div>
            </div>

        </div>
    </main>
    <div id="footer-container"></div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/admin-orders.js"></script>
    <script src="../js/fetchAdminNav.js"></script>
    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>

</body>

</html>
