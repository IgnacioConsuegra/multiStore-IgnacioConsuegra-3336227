<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account - Academia</title>
    
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="profile-wrapper py-5">
        <div class="container max-w-7xl">
            
            <!-- Header -->
            <div class="mb-5">
                <h1 class="font-heading fw-bold text-dark-custom display-5 mb-2">My Account</h1>
                <p class="text-muted-custom">Manage your profile and view your orders</p>
            </div>

            <!-- Tabs -->
            <div class="border-bottom custom-border-light mb-5">
                <div class="d-flex gap-4">
                    <button id="tab-profile" class="tab-btn active">Profile Information</button>
                    <button id="tab-orders" class="tab-btn">Order History</button>
                </div>
            </div>

            <!-- Profile Section -->
            <section id="section-profile" class="max-w-2xl">
                <div class="bg-paper p-4 p-md-5 rounded-1 border custom-border-light shadow-sm">
                    
                    <div class="d-flex align-items-center justify-content-between mb-4">
                        <h2 class="font-heading fs-4 fw-bold text-dark-custom mb-0">Personal Information</h2>
                        
                        <!-- Actions -->
                        <div id="profile-actions-view">
                            <button id="btn-edit-profile" class="btn btn-action-text text-primary-custom d-flex align-items-center gap-2">
                                <i class="fa-solid fa-pen"></i> Edit
                            </button>
                        </div>
                        <div id="profile-actions-edit" class="d-none d-flex gap-2">
                            <button id="btn-save-profile" class="btn btn-custom d-flex align-items-center gap-2 px-3 py-1">
                                <i class="fa-solid fa-floppy-disk"></i> Save
                            </button>
                            <button id="btn-cancel-profile" class="btn btn-outline-custom d-flex align-items-center gap-2 px-3 py-1">
                                <i class="fa-solid fa-xmark"></i> Cancel
                            </button>
                        </div>
                    </div>

                    <form id="profile-form">
                        <div class="d-flex flex-column gap-4">
                            
                            <!-- Name & Email -->
                            <div>
                                <label class="form-label text-dark-custom fw-medium small mb-1">Full Name</label>
                                <div class="position-relative">
                                    <i class="fa-regular fa-user input-icon"></i>
                                    <input type="text" id="prof-name" class="form-control icon-input" disabled required>
                                </div>
                            </div>

                            <div>
                                <label class="form-label text-dark-custom fw-medium small mb-1">Email Address</label>
                                <div class="position-relative">
                                    <i class="fa-regular fa-envelope input-icon"></i>
                                    <input type="email" id="prof-email" class="form-control icon-input" disabled required>
                                </div>
                            </div>

                            <div>
                                <label class="form-label text-dark-custom fw-medium small mb-1">Phone Number</label>
                                <div class="position-relative">
                                    <i class="fa-solid fa-phone input-icon"></i>
                                    <input type="tel" id="prof-phone" class="form-control icon-input" disabled required>
                                </div>
                            </div>

                            <!-- Address -->
                            <div class="pt-3 border-top custom-border-light mt-2">
                                <h3 class="fw-medium text-dark-custom fs-6 mb-3">Address Details</h3>
                                
                                <div class="mb-3">
                                    <label class="form-label text-dark-custom fw-medium small mb-1">Street Address</label>
                                    <div class="position-relative">
                                        <i class="fa-solid fa-location-dot input-icon"></i>
                                        <input type="text" id="prof-street" class="form-control icon-input" disabled required>
                                    </div>
                                </div>

                                <div class="row g-3 mb-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-dark-custom fw-medium small mb-1">City</label>
                                        <input type="text" id="prof-city" class="form-control simple-input" disabled required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-dark-custom fw-medium small mb-1">State/Province</label>
                                        <input type="text" id="prof-state" class="form-control simple-input" disabled required>
                                    </div>
                                </div>

                                <div class="row g-3">
                                    <div class="col-md-6">
                                        <label class="form-label text-dark-custom fw-medium small mb-1">Zip Code</label>
                                        <input type="text" id="prof-zip" class="form-control simple-input" disabled required>
                                    </div>
                                    <div class="col-md-6">
                                        <label class="form-label text-dark-custom fw-medium small mb-1">Country</label>
                                        <input type="text" id="prof-country" class="form-control simple-input" disabled required>
                                    </div>
                                </div>
                            </div>

                            <!-- Account Info -->
                            <div class="pt-4 border-top custom-border-light mt-2 d-flex align-items-center justify-content-between">
                                <div>
                                    <p class="form-label text-dark-custom fw-medium small mb-1">Account Type</p>
                                    <p id="prof-role" class="text-muted-custom text-capitalize mb-0"></p>
                                </div>
                                <button type="button" id="btn-logout" class="btn btn-outline-danger px-4">Logout</button>
                            </div>

                        </div>
                    </form>
                </div>
            </section>

            <!-- Orders Section -->
            <section id="section-orders" class="d-none">
                <h2 class="font-heading fs-4 fw-bold text-dark-custom mb-4">Order History</h2>

                <div id="orders-container" class="d-flex flex-column gap-4">
                </div>

                <div id="orders-empty" class="bg-paper p-5 rounded-1 border custom-border-light text-center d-none">
                    <i class="fa-solid fa-box-open text-muted-custom opacity-25 display-3 mb-3"></i>
                    <p class="text-muted-custom mb-4">No orders yet</p>
                    <a href="/products.html" class="btn btn-custom px-4 py-2">Start Shopping</a>
                </div>
            </section>

        </div>
    </main>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
