<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection</title>
    
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/collections.css">
</head>
<body>
    <div id="navbar-container"></div>

<main class="collection-section py-5">
        <div class="container py-4">
            
            <!-- Header -->
            <div class="mb-5">
                <h1 class="font-heading fw-bold text-dark-custom mb-3 display-5">
                    Our Collection
                </h1>
                <p class="text-muted-custom fs-6">
                    <span id="item-count">0</span> items found
                </p>
            </div>

            <!-- Search and Filter Controls -->
            <div class="mb-5">
                <!-- Search Bar -->
                <div class="position-relative mb-4">
                    <i class="fa-solid fa-magnifying-glass position-absolute" style="left: 1rem; top: 50%; transform: translateY(-50%); color: #6c757d;"></i>
                    <input type="text" id="search-input" class="form-control" style="padding-left: 2.5rem; border-radius: 2px;" placeholder="Search by name, category, or description...">
                </div>

                <!-- Filter and Sort Bar -->
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-between align-items-start align-items-sm-center">
                    
                    <button class="btn btn-outline-dark d-flex align-items-center gap-2 rounded-1" type="button" data-bs-toggle="collapse" data-bs-target="#filtersPanel" aria-expanded="false" aria-controls="filtersPanel">
                        <i class="fa-solid fa-sliders"></i>
                        <span class="fw-medium">Filters</span>
                    </button>

                    <!-- Sort Select -->
                    <select id="sort-select" class="form-select w-auto rounded-1">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>

            <!-- Filters Panel -->
            <div class="collapse mb-5" id="filtersPanel">
                <div class="card card-body border-0 bg-light rounded-1">
                    <div class="row g-4">
                        
                        <!-- Category -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Category</h3>
                            <div class="d-flex flex-column gap-2" id="filter-category">
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Literature" class="filter-check category-check"> <span>Literature</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Accessories" class="filter-check category-check"> <span>Accessories</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Leather Goods" class="filter-check category-check"> <span>Leather Goods</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Clothing" class="filter-check category-check"> <span>Clothing</span>
                                </label>
                            </div>
                        </div>

                        <!-- Size -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Size</h3>
                            <div class="d-flex flex-column gap-2" id="filter-size">
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="S" class="filter-check size-check"> <span>Small (S)</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="M" class="filter-check size-check"> <span>Medium (M)</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="L" class="filter-check size-check"> <span>Large (L)</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="XL" class="filter-check size-check"> <span>Extra Large (XL)</span>
                                </label>
                            </div>
                        </div>

                        <!-- Color -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Color</h3>
                            <div class="d-flex flex-column gap-2" id="filter-color">
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Black" class="filter-check color-check"> <span>Black</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Brown" class="filter-check color-check"> <span>Brown</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Navy" class="filter-check color-check"> <span>Navy</span>
                                </label>
                            </div>
                        </div>

                        <!-- Material -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Material</h3>
                            <div class="d-flex flex-column gap-2" id="filter-material">
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Leather" class="filter-check material-check"> <span>Leather</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Wool" class="filter-check material-check"> <span>Wool</span>
                                </label>
                                <label class="custom-checkbox d-flex align-items-center gap-2">
                                    <input type="checkbox" value="Cashmere" class="filter-check material-check"> <span>Cashmere</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div class="mt-4 pt-4 border-top">
                        <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Price Range</h3>
                        <div class="d-flex align-items-center gap-3" style="max-width: 300px;">
                            <input type="number" id="price-min" class="form-control rounded-1" value="0" min="0" placeholder="Min $">
                            <span class="text-muted-custom">to</span>
                            <input type="number" id="price-max" class="form-control rounded-1" value="1000" min="0" placeholder="Max $">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="row g-4" id="products-grid">
            </div>

        </div>
    </main>

    
    <div id="footer-container"></div>

    <script src="../js/fetchNavBar.js"></script>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/collections.js"></script>
</body>
</html>
