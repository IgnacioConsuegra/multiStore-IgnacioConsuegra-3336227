<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Collection</title>
    
    <!-- Archivos Locales en Vendor -->
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS de Collection -->
    <link rel="stylesheet" href="../css/collections.css">
</head>
<body>
    <div id="navbar-container"></div>

    <main class="collection-section py-5">
        <div class="container py-4">
            
            <!-- Header -->
            <div class="mb-5">
                <h1 class="font-heading fw-bold text-dark-custom mb-3 display-5">
                    Our Collection
                </h1>
                <p class="text-muted-custom fs-6">
                    <span id="item-count">2</span> items found
                </p>
            </div>

            <!-- Search and Filter Controls -->
            <div class="mb-5">
                <!-- Search Bar -->
                <div class="position-relative mb-4">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" class="custom-search-input w-100" placeholder="Search by name, category, or description...">
                </div>

                <!-- Filter and Sort Bar -->
                <div class="d-flex flex-column flex-sm-row gap-3 justify-content-between align-items-start align-items-sm-center">
                    
                    <!-- Botón para abrir filtros -->
                    <button class="filter-toggle-btn d-flex align-items-center gap-2" type="button" data-bs-toggle="collapse" data-bs-target="#filtersPanel" aria-expanded="false" aria-controls="filtersPanel">
                        <i class="fa-solid fa-sliders"></i>
                        <span class="fw-medium">Filters</span>
                    </button>

                    <!-- Sort Select -->
                    <select class="custom-sort-select">
                        <option value="featured">Featured</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="name">Name: A to Z</option>
                        <option value="rating">Highest Rated</option>
                    </select>
                </div>
            </div>

            <!-- Filters Panel (Colapsable con Bootstrap) -->
            <div class="collapse mb-5" id="filtersPanel">
                <div class="filters-panel-body">
                    <div class="row g-4">
                        
                        <!-- Category -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Category</h3>
                            <div class="d-flex flex-column gap-2">
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Literature</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Accessories</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Leather Goods</span>
                                </label>
                            </div>
                        </div>

                        <!-- Size -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Size</h3>
                            <div class="d-flex flex-column gap-2">
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Small</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Medium</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Large</span>
                                </label>
                            </div>
                        </div>

                        <!-- Color -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Color</h3>
                            <div class="d-flex flex-column gap-2">
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Black</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Brown</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Navy</span>
                                </label>
                            </div>
                        </div>

                        <!-- Material -->
                        <div class="col-12 col-sm-6 col-lg-3">
                            <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Material</h3>
                            <div class="d-flex flex-column gap-2">
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Leather</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Wool</span>
                                </label>
                                <label class="custom-checkbox">
                                    <input type="checkbox"> <span>Paper</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <!-- Price Range -->
                    <div class="mt-4 pt-4 border-top custom-border-light">
                        <h3 class="font-heading h6 fw-bold mb-3 text-dark-custom">Price Range</h3>
                        <div class="d-flex align-items-center gap-3">
                            <input type="number" class="custom-price-input" value="0" min="0">
                            <span class="text-muted-custom">to</span>
                            <input type="number" class="custom-price-input" value="500" min="0">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Products Grid -->
            <div class="row g-4">
                
                <!-- Product Card 1 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="product-card">
                        <a href="#" class="text-decoration-none d-block">
                            <div class="product-img-wrapper">
                                <img src="https://images.unsplash.com/photo-1544816155-12df9643f363?w=500" alt="Cashmere Beanie">
                            </div>
                        </a>
                        <div class="product-info">
                            <div>
                                <h3 class="font-heading product-title">Cashmere Beanie</h3>
                                <p class="product-price">$90.00</p>
                            </div>
                            <button class="cart-btn" aria-label="Add to cart">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Product Card 2 -->
                <div class="col-12 col-sm-6 col-lg-3">
                    <div class="product-card">
                        <a href="#" class="text-decoration-none d-block">
                            <div class="product-img-wrapper">
                                <img src="https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500" alt="Quilted Jacket">
                            </div>
                        </a>
                        <div class="product-info">
                            <div>
                                <h3 class="font-heading product-title">Quilted Jacket</h3>
                                <p class="product-price">$280.00</p>
                            </div>
                            <button class="cart-btn" aria-label="Add to cart">
                                <i class="fa-solid fa-cart-shopping"></i>
                            </button>
                        </div>
                    </div>
                </div>

            </div>

        </div>
    </main>

    
    <div id="footer-container"></div>

    <script src="../js/fetchNavBar.js"></script>

    <!-- JS de Bootstrap -->
    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>
</body>
</html>
