<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Academia</title>
    
    <!-- Archivos Locales en Vendor -->
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">

    <!-- CSS del Signup -->
    <link rel="stylesheet" href="../css/signup.css">
</head>
<body>
  <div id="navbar-container"></div>
    <main class="auth-wrapper">
        <div class="signup-container">
            
            <!-- Header -->
            <div class="text-center mb-5">
                <div class="icon-placeholder mx-auto mb-4 d-flex align-items-center justify-content-center">
                    <i class="fa-solid fa-book-open fs-2 text-white"></i>
                </div>
                <h2 class="font-heading fw-bold mb-2 text-dark-custom">Join Academia</h2>
                <p class="text-muted-custom">Create your account to start shopping</p>
            </div>

            <!-- Error Message (Hidden by default) -->
            <div id="error-message" class="alert alert-danger d-none py-2 px-3 small border-0 rounded-1" role="alert">
                <!-- El texto del error se inyecta por JS -->
            </div>

            <!-- Form -->
            <form id="signup-form">
                
                <!-- Full Name -->
                <div class="mb-3">
                    <label for="name" class="form-label text-dark-custom fw-medium small mb-1">Full Name</label>
                    <div class="custom-input-group position-relative">
                        <i class="fa-regular fa-user position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="text" id="name" name="name" class="form-control" placeholder="John Doe" required>
                    </div>
                </div>

                <!-- Email -->
                <div class="mb-3">
                    <label for="email" class="form-label text-dark-custom fw-medium small mb-1">Email Address</label>
                    <div class="custom-input-group position-relative">
                        <i class="fa-regular fa-envelope position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="email" id="email" name="email" class="form-control" placeholder="scholar@academia.edu" required>
                    </div>
                </div>

                <!-- Phone -->
                <div class="mb-3">
                    <label for="phone" class="form-label text-dark-custom fw-medium small mb-1">Phone Number</label>
                    <div class="custom-input-group position-relative">
                        <i class="fa-solid fa-phone position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="tel" id="phone" name="phone" class="form-control" placeholder="+1 (555) 123-4567" required>
                    </div>
                </div>

                <!-- Address Details -->
                <div class="mb-3">
                    <label class="form-label text-dark-custom fw-medium small mb-1">Address Details</label>
                    
                    <!-- Street -->
                    <div class="custom-input-group position-relative mb-2">
                        <i class="fa-solid fa-location-dot position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="text" id="street" name="street" class="form-control" placeholder="Street Address (e.g. 20 Oak Avenue)" required>
                    </div>
                    
                    <!-- City / State -->
                    <div class="row g-2 mb-2">
                        <div class="col-6">
                            <input type="text" id="city" name="city" class="form-control simple-input" placeholder="City" required>
                        </div>
                        <div class="col-6">
                            <input type="text" id="state" name="state" class="form-control simple-input" placeholder="State/Province" required>
                        </div>
                    </div>
                    
                    <!-- Zip Code / Country -->
                    <div class="row g-2">
                        <div class="col-6">
                            <input type="text" id="zipCode" name="zipCode" class="form-control simple-input" placeholder="Zip Code" required>
                        </div>
                        <div class="col-6">
                            <input type="text" id="country" name="country" class="form-control simple-input" placeholder="Country" required>
                        </div>
                    </div>
                </div>

                <!-- Password -->
                <div class="mb-3">
                    <label for="password" class="form-label text-dark-custom fw-medium small mb-1">Password</label>
                    <div class="custom-input-group position-relative">
                        <i class="fa-solid fa-lock position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Confirm Password -->
                <div class="mb-4">
                    <label for="confirmPassword" class="form-label text-dark-custom fw-medium small mb-1">Confirm Password</label>
                    <div class="custom-input-group position-relative">
                        <i class="fa-solid fa-lock position-absolute text-muted-custom" style="left: 1rem; top: 50%; transform: translateY(-50%);"></i>
                        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" required>
                    </div>
                </div>

                <!-- Terms -->
                <div class="mb-4 form-check d-flex align-items-start gap-2 ps-0">
                    <input type="checkbox" id="terms" class="custom-checkbox mt-1" required>
                    <label for="terms" class="text-muted-custom small mb-0 lh-sm">
                        I agree to the <a href="#" class="text-primary-custom text-decoration-none">Terms of Service</a> and <a href="#" class="text-primary-custom text-decoration-none">Privacy Policy</a>
                    </label>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submit-btn" class=" btn-custom w-100 py-2 mb-4">
                    Create Account
                </button>

                <!-- Sign In Link -->
                <p class="text-center text-muted-custom small mb-0">
                    Already have an account? 
                    <a href="login.html" class="text-primary-custom text-decoration-none fw-medium">Sign in</a>
                </p>

            </form>
        </div>
    </main>
    <div id="footer-container"></div>

    <!-- JS Local -->
    <script src="../js/signup.js"></script>
        <script src="../js/fetchNavBar.js"></script>

</body>
</html>
