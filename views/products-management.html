<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Management - Academia</title>
    
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/products-management.css">
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>

    <main class="management-wrapper py-5">
        <div class="container">
            
            <!-- Header -->
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="font-heading fw-bold text-dark-custom mb-0 fs-2">Product Management</h2>
                <button id="toggle-form-btn" class="btn btn-custom px-4 py-2 d-flex align-items-center gap-2">
                    <i class="fa-solid fa-plus"></i> Add Product
                </button>
            </div>

            <!-- Form Section (Oculto por defecto) -->
            <div id="product-form-section" class="bg-paper p-4 p-md-5 rounded-1 border custom-border-light shadow-sm mb-5 d-none animate-slide-down">
                <h3 class="font-heading fs-4 fw-bold text-dark-custom border-bottom custom-border-light pb-3 mb-4" id="form-title">Create New Product</h3>
                
                <form id="product-form">
                    <input type="hidden" id="product-id">
                    
                    <div class="row g-4 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-dark-custom fw-medium small mb-1">Product Name</label>
                            <input type="text" id="prod-name" class="form-control simple-input" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-dark-custom fw-medium small mb-1">Category</label>
                            <input type="text" id="prod-category" class="form-control simple-input" placeholder="e.g. Accessories" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-dark-custom fw-medium small mb-1">Description</label>
                        <textarea id="prod-desc" class="form-control simple-input" rows="3" required></textarea>
                    </div>

                    <div class="row g-4 mb-4">
                        <div class="col-md-4">
                            <label class="form-label text-dark-custom fw-medium small mb-1">Price ($)</label>
                            <input type="number" step="0.01" id="prod-price" class="form-control simple-input" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-dark-custom fw-medium small mb-1">Stock</label>
                            <input type="number" id="prod-stock" class="form-control simple-input" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label text-dark-custom fw-medium small mb-1">Image URL</label>
                            <input type="url" id="prod-image" class="form-control simple-input" placeholder="https://..." required>
                        </div>
                    </div>

                    <!-- Properties -->
                    <div class="border-top custom-border-light pt-4 mb-4">
                        <h4 class="font-heading fs-5 fw-semibold text-dark-custom mb-3">Properties (Comma separated)</h4>
                        <div class="row g-4">
                            <div class="col-md-4">
                                <label class="form-label text-dark-custom fw-medium small mb-1">Sizes</label>
                                <input type="text" id="prod-sizes" class="form-control simple-input" placeholder="e.g. S, M, L, XL">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-dark-custom fw-medium small mb-1">Colors</label>
                                <input type="text" id="prod-colors" class="form-control simple-input" placeholder="e.g. Black, Navy, Beige">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-dark-custom fw-medium small mb-1">Materials</label>
                                <input type="text" id="prod-materials" class="form-control simple-input" placeholder="e.g. Cotton, Wool">
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-3">
                        <button type="button" id="cancel-form-btn" class="btn btn-outline-custom px-4 py-2">Cancel</button>
                        <button type="submit" class="btn btn-custom px-5 py-2">Save Product</button>
                    </div>
                </form>
            </div>

            <!-- Products Table -->
            <div class="bg-paper rounded-1 border custom-border-light overflow-hidden shadow-sm">
                <div class="table-responsive">
                    <table class="table custom-table mb-0 align-middle">
                        <thead class="bg-light-custom">
                            <tr>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4">Product</th>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4">Category</th>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4">Price</th>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4">Stock</th>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4">Rating</th>
                                <th class="text-dark-custom font-heading fw-semibold py-3 px-4 text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-tbody" class="border-top-0">
                            <!-- JS Inyecta los productos aquí -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>
    </main>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/products-management.js"></script>
        <script src="../js/fetchNavBar.js"></script>
</body>
</html>
