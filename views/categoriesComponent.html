<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login</title>

    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/categories.css">
</head>

<body>
    <div id="navbar-container"></div>
<section class="py-5 bg-paper">
        <div class="container py-4">
            
            <!-- Header -->
            <div class="text-center mb-5">
                <h2 class="font-heading fw-bold text-dark-custom mb-3" style="font-size: 2.5rem;">
                    Shop by Category
                </h2>
                <p class="fs-5 mx-auto text-muted-custom" style="max-width: 42rem;">
                    Discover our carefully curated collections, each piece selected
                    for its timeless appeal and exceptional quality.
                </p>
            </div>

            <!-- Categories Grid -->
            <div class="row g-4">
                
                <!-- Category Card 1 -->
                <div class="col-6 col-md-3">
                    <a href="/products" class="category-card d-block text-decoration-none h-100">
                        <div class="card-dec-circle"></div>
                        
                        <div class="position-relative z-1">
                            <div class="card-icon-wrapper">
                                <i class="fa-solid fa-book-open"></i>
                            </div>
                            <h3 class="font-heading card-title">Literature</h3>
                            <p class="card-count">120 items</p>
                        </div>
                    </a>
                </div>

                <!-- Category Card 2 -->
                <div class="col-6 col-md-3">
                    <a href="/products" class="category-card d-block text-decoration-none h-100" style="animation-delay: 100ms;">
                        <div class="card-dec-circle"></div>
                        
                        <div class="position-relative z-1">
                            <div class="card-icon-wrapper">
                                <i class="fa-solid fa-glasses"></i>
                            </div>
                            <h3 class="font-heading card-title">Accessories</h3>
                            <p class="card-count">85 items</p>
                        </div>
                    </a>
                </div>

                <!-- Category Card 3 -->
                <div class="col-6 col-md-3">
                    <a href="/products" class="category-card d-block text-decoration-none h-100" style="animation-delay: 200ms;">
                        <div class="card-dec-circle"></div>
                        
                        <div class="position-relative z-1">
                            <div class="card-icon-wrapper">
                                <i class="fa-solid fa-pen-nib"></i>
                            </div>
                            <h3 class="font-heading card-title">Stationery</h3>
                            <p class="card-count">240 items</p>
                        </div>
                    </a>
                </div>

                <!-- Category Card 4 -->
                <div class="col-6 col-md-3">
                    <a href="/products" class="category-card d-block text-decoration-none h-100" style="animation-delay: 300ms;">
                        <div class="card-dec-circle"></div>
                        
                        <div class="position-relative z-1">
                            <div class="card-icon-wrapper">
                                <i class="fa-solid fa-briefcase"></i>
                            </div>
                            <h3 class="font-heading card-title">Leather Goods</h3>
                            <p class="card-count">45 items</p>
                        </div>
                    </a>
                </div>

            </div>
        </div>
    </section>


    <div id="footer-container"></div>

    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../vendor/bootstrap.bundle.min.js"></script>

</body>

</html>
