<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details - Academia</title>

    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="../css/productDetails.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="product-page py-5">
        <div class="container py-4">

            <!-- Back Button -->
            <a href="collections.html"
                class="back-link d-inline-flex align-items-center gap-2 mb-5 text-decoration-none">
                <i class="fa-solid fa-arrow-left"></i>
                <span>Back to Shop</span>
            </a>

            <div class="row g-5">

                <!-- Product Gallery (Desktop: Left Vertical 4-Thumb Carousel | Mobile: Bottom Horizontal Row) -->
                <div class="col-12 col-lg-6">
                    <div class="product-gallery-wrapper d-flex flex-column flex-md-row gap-3">
                        
                        <!-- Thumbnail Carousel (Bottom on mobile, Left on desktop) -->
                        <div class="vertical-carousel-col order-2 order-md-1 position-relative d-flex flex-row flex-md-column">
                            <button type="button" id="thumb-prev-btn" class="thumb-nav-btn thumb-nav-up d-none" aria-label="Previous thumbnails">
                                <i class="fa-solid fa-chevron-up"></i>
                            </button>

                            <div id="vertical-thumbs-list" class="vertical-thumbs-list d-flex flex-row flex-md-column gap-2 flex-grow-1">
                                <!-- 4 thumbnails rendered dynamically by JS -->
                            </div>

                            <button type="button" id="thumb-next-btn" class="thumb-nav-btn thumb-nav-down d-none" aria-label="Next thumbnails">
                                <i class="fa-solid fa-chevron-down"></i>
                            </button>
                        </div>

                        <!-- Main Image Display (Top on mobile, Right on desktop) -->
                        <div class="product-image-container order-1 order-md-2 flex-grow-1 position-relative border custom-border-light rounded-1 overflow-hidden">
                            <!-- Discount Badge (Top-Left) -->
                            <span id="prod-discount-badge" class="discount-badge-custom position-absolute d-none z-2"></span>

                            <!-- Fullscreen Expand Button (Top-Right) -->
                            <button type="button" id="btn-fullscreen-img" class="gallery-expand-btn position-absolute z-2" aria-label="Expand image" title="View full screen">
                                <i class="fa-solid fa-up-right-and-down-left-from-center"></i>
                            </button>

                            <!-- Main Image Prev/Next Arrows -->
                            <button type="button" id="main-img-prev" class="main-gallery-arrow arrow-left d-none" aria-label="Previous image">
                                <i class="fa-solid fa-chevron-left"></i>
                            </button>

                            <img id="prod-img" src="" alt="" class="w-100 h-100 object-fit-cover">

                            <button type="button" id="main-img-next" class="main-gallery-arrow arrow-right d-none" aria-label="Next image">
                                <i class="fa-solid fa-chevron-right"></i>
                            </button>
                        </div>

                    </div>
                </div>

                <!-- Product Info -->
                <div class="col-12 col-lg-6">
                    <div class="d-flex flex-column gap-4">

                        <!-- Header -->
                        <div>
                            <h1 id="prod-name" class="font-heading fw-bold text-dark-custom mb-3 display-5"></h1>
                            <p id="prod-price" class="font-heading fw-bold text-dark-custom display-6 mb-0"></p>
                        </div>

                        <!-- Description Divider & Collections -->
                        <div class="border-top custom-border-light pt-4">
                            <p id="prod-desc" class="text-muted-custom fs-6 mb-0"></p>
                            <!-- Botones pequeños en gris con las colecciones -->
                            <div id="prod-categories" class="d-flex flex-wrap gap-2 mt-3"></div>
                        </div>

                        <!-- Dynamic Properties -->
                        <div id="prod-properties" class="properties-section d-flex flex-column gap-4 mt-2">
                        </div>

                        <!-- Quantity -->
                        <div class="mt-2">
                            <h3 class="property-label text-capitalize fw-bold mb-3 fs-6">Quantity</h3>
                            <div class="d-flex align-items-center gap-3">
                                <div class="quantity-selector d-flex align-items-center">
                                    <button class="qty-btn" id="btn-minus" aria-label="Decrease quantity">
                                        <i class="fa-solid fa-minus fs-7"></i>
                                    </button>
                                    <span class="qty-display fw-medium" id="qty-value">1</span>
                                    <button class="qty-btn" id="btn-plus" aria-label="Increase quantity">
                                        <i class="fa-solid fa-plus fs-7"></i>
                                    </button>
                                </div>
                                <span id="prod-stock" class="text-muted-custom small"></span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="d-flex gap-3 mt-2">
                            <button class="btn-add-cart flex-grow-1 d-flex justify-content-center align-items-center gap-2">
                                <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                            </button>
                            <button class="btn btn-wishlist d-flex justify-content-center align-items-center"
                                aria-label="Add to wishlist">
                                <i class="fa-regular fa-heart"></i>
                            </button>
                        </div>

                        <!-- Success Message -->
                        <div id="success-msg" class="success-message d-none mt-2">
                            <i class="fa-solid fa-check me-2"></i> Added to cart successfully!
                        </div>

                        <!-- Features -->
                        <div class="row g-4 pt-4 mt-2 border-top custom-border-light">
                            <div class="col-6 d-flex align-items-center gap-3">
                                <div class="feature-icon-wrapper rounded-circle d-flex justify-content-center align-items-center">
                                    <i class="fa-solid fa-truck"></i>
                                </div>
                                <div>
                                    <p class="fw-medium text-dark-custom mb-0 fs-6">Free Shipping</p>
                                    <p class="text-muted-custom small mb-0">Orders over $200</p>
                                </div>
                            </div>
                            <div class="col-6 d-flex align-items-center gap-3">
                                <div class="feature-icon-wrapper rounded-circle d-flex justify-content-center align-items-center">
                                    <i class="fa-solid fa-shield-halved"></i>
                                </div>
                                <div>
                                    <p class="fw-medium text-dark-custom mb-0 fs-6">Secure Payment</p>
                                    <p class="text-muted-custom small mb-0">100% protected</p>
                                </div>
                            </div>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </main>

    <!-- Fullscreen Image Lightbox Modal -->
    <div class="modal fade" id="imageLightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-xl">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 d-flex justify-content-center align-items-center">
                    <div class="position-relative d-inline-block">
                        <button type="button" class="lightbox-close-btn" data-bs-dismiss="modal" aria-label="Close">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                        <img id="lightbox-img" src="" alt="Full screen preview" class="img-fluid rounded-1 shadow-lg" style="max-height: 88vh; object-fit: contain;">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-container"></div>

    <!-- JS de Bootstrap -->
    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script src="../js/product.js"></script>

    <script src="../js/navbar.js"></script>
    <script src="../js/fetchNavBar.js"></script>
</body>

</html>
