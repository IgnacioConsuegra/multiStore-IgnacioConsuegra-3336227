<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Academia</title>

    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Chart.js for visualizations -->

    <link rel="stylesheet" href="../css/admin.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="dashboard-wrapper py-5">
        <div class="container">
            <div id="adminManagement"></div>
            <div class="d-flex justify-content-between align-items-center mb-5">
                <h2 class="font-heading fw-bold text-dark-custom mb-0 fs-4">Store Analytics</h2>
                </button>
            </div>
            <!-- Stats Cards -->
            <div class="row g-4 mb-5">
                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="icon-wrapper bg-primary-light">
                                <i class="fa-solid fa-dollar-sign text-primary-custom"></i>
                            </div>
                            <i class="fa-solid fa-arrow-trend-up text-success"></i>
                        </div>
                        <p class="stat-label">Total Revenue</p>
                        <p class="stat-value" id="stat-revenue">$0</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="icon-wrapper bg-primary-light">
                                <i class="fa-solid fa-bag-shopping text-primary-custom"></i>
                            </div>
                            <i class="fa-solid fa-arrow-trend-up text-success"></i>
                        </div>
                        <p class="stat-label">Total Orders</p>
                        <p class="stat-value" id="stat-orders">0</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="icon-wrapper bg-primary-light">
                                <i class="fa-solid fa-box text-primary-custom"></i>
                            </div>
                        </div>
                        <p class="stat-label">Total Products</p>
                        <p class="stat-value" id="stat-products">0</p>
                    </div>
                </div>

                <div class="col-12 col-md-6 col-lg-3">
                    <div class="stat-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div class="icon-wrapper bg-primary-light">
                                <i class="fa-solid fa-users text-primary-custom"></i>
                            </div>
                        </div>
                        <p class="stat-label">Avg Order Value</p>
                        <p class="stat-value" id="stat-aov">$0</p>
                    </div>
                </div>
            </div>

            <!-- Line & Bar Charts -->
            <div class="row g-4 mb-5">
                <div class="col-12 col-lg-6">
                    <div class="chart-card p-4">
                        <h3 class="font-heading fs-5 fw-bold text-dark-custom mb-4">Sales Trend</h3>
                        <div class="chart-container">
                            <canvas id="salesTrendChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="chart-card p-4">
                        <h3 class="font-heading fs-5 fw-bold text-dark-custom mb-4">Orders by Month</h3>
                        <div class="chart-container">
                            <canvas id="ordersMonthChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Pie Chart -->
            <div class="row g-4 mb-5">
                <div class="col-12">
                    <div class="chart-card p-4">
                        <h3 class="font-heading fs-5 fw-bold text-dark-custom mb-4">Sales by Category</h3>
                        <div class="pie-chart-container mx-auto">
                            <canvas id="categoryPieChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Low Stock Alert -->
            <div class="row g-4">
                <div class="col-12">
                    <div class="chart-card p-4">
                        <h3 class="font-heading fs-5 fw-bold text-dark-custom mb-4">Low Stock Alert</h3>
                        <div id="low-stock-container" class="d-flex flex-column gap-3">
                            <!-- Populated by JS -->
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>
    <div id="footer-container"></div>

    <script src="../vendor/bootstrap.bundle.min.js"></script>
        <script src="../vendor/chart.js"></script>

    <script src="../js/admin.js"></script>
    <script src="../js/fetchNavBar.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/fetchAdminNav.js"></script>
</body>

</html>
