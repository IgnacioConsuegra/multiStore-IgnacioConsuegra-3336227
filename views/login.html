<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Login</title>

    <!-- Archivos Locales en Vendor -->
    <link href="../vendor/bootstrap.min.css" rel="stylesheet">
    <link href="../vendor/all.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=PT+Serif:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- CSS del Login -->
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <!-- Aquí iría inyectado o importado tu navBar.html -->
    <div id="navbar-container"></div>

    <main class="auth-wrapper">
        <div class="login-container text-center">

            <!-- Header Icon -->
            <div class="icon-placeholder mx-auto mb-3" style="width: 64px; height: 64px; border-radius: 4px;">
                <i class="fa-regular fa-image fs-3"></i>
            </div>

            <!-- Titles -->
            <h1 class="font-heading fw-bold mb-2">Welcome back</h1>
            <p class="mb-4 text-dark" style="font-size: 0.9rem;">Sign in to your account to continue</p>

            <!-- Login Form -->
            <form class="text-start">

                <!-- Email Field -->
                <div class="mb-4">
                    <label class="form-label text-dark">Email Address</label>
                    <div class="custom-input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" class="form-control py-2" placeholder="youremail@email.com" required>
                    </div>
                </div>

                <!-- Password Field -->
                <div class="mb-3">
                    <label class="form-label text-dark">Password</label>
                    <div class="custom-input-group">
                        <span class="input-group-text">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" class="form-control py-2" placeholder="********" required>
                    </div>
                </div>

                <!-- Forgot Password Link -->
                <div class="mb-4">
                    <a href="#" class="text-dark text-decoration-none" style="font-size: 0.85rem;">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" class=" btn-custom w-100 py-2 mb-4 shadow-sm border-0">Sign in</button>

                <!-- Signup Link -->
                <p class="text-center text-dark" style="font-size: 0.85rem;">
                    Don't have an account ? <a href="#" class="text-dark text-decoration-none">Sign up</a>
                </p>

            </form>
        </div>
    </main>

    <!-- JS Local en Vendor -->
    <script src="../vendor/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function (e) {
            e.preventDefault();
            console.log("Login form submitted!");
        });
    </script>
    <script>
        fetch('../components/navBar.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('navbar-container').innerHTML = data;
            });

    </script>
</body>

</html>
